name: Atualizar Financial Time

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: financial-time-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests lxml

      - name: Atualizar cotacoes
        run: python update_quotes.py

      - name: Atualizar noticias e desempenho semanal
        run: |
          MINUTE=$(date -u +%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$MINUTE" -lt 15 ]; then
            python update_news.py
            python update_weekly.py
          else
            echo "Atualizacao horaria ainda nao necessaria."
          fi

      - name: Guardar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-quotes.json news.json weekly-performance.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar dados Financial Time"
            git push
          fi
